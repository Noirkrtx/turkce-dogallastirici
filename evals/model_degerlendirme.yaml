  degerlendiren: vakaları yazan model (bağımsız değil)
  skill:
    bilgi_eklendi_mi: hayır
    iddia_gucu_degisti_mi: hayır
    kip_korundu_mu: evet
    alinti_not: ''':'' tanıtımı ''adıyla yazacağım'' cümlesine açıldı; ''Bazen, kısa, satranç'' kesik parçası düz cümle oldu; ''zekâ'' → ''zeka''.'
